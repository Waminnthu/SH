<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Apple Music Plans | SHOP HERE</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "background": "#0A0A0A",
          "surface-container-lowest": "#0e0e0e",
          "outline": "#8c90a1",
          "on-background": "#e5e2e1",
          "on-surface": "#e5e2e1",
          "on-surface-variant": "#c2c6d8",
          "surface-container": "#201f1f",
          "surface-container-high": "#2a2a2a",
          "primary": "#b0c6ff",
          "primary-container": "#568dff",
          "surface-dim": "#131313",
          "surface": "#131313"
        },
        fontFamily: {
          "body-lg": ["Inter"],
          "body-md": ["Inter"],
          "h1": ["Space Grotesk"],
          "h2": ["Space Grotesk"],
          "h3": ["Space Grotesk"],
          "label-caps": ["Space Grotesk"]
        },
        fontSize: {
          "body-lg": ["18px", {lineHeight:"1.6", fontWeight:"400"}],
          "body-md": ["16px", {lineHeight:"1.5", fontWeight:"400"}],
          "h1": ["64px", {lineHeight:"1.1", letterSpacing:"-0.02em", fontWeight:"700"}],
          "h2": ["40px", {lineHeight:"1.2", letterSpacing:"-0.01em", fontWeight:"600"}],
          "h3": ["24px", {lineHeight:"1.3", fontWeight:"600"}],
          "label-caps": ["12px", {lineHeight:"1.0", letterSpacing:"0.1em", fontWeight:"700"}]
        },
        spacing: {
          "xs":"4px","sm":"8px","md":"16px","lg":"24px","xl":"48px","xxl":"80px"
        }
      }
    }
  }
</script>
<style>
  .glass-card { background:rgba(255,255,255,0.03); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1); }
  .glow-blue { box-shadow:0 0 20px rgba(0,112,255,0.4); }
  .glow-pip { box-shadow:0 0 8px #0070FF; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; display:inline-block; vertical-align:middle; }
</style>
</head>
<body class="bg-[#0A0A0A] text-on-background font-body-md overflow-x-hidden">

<!-- Navigation -->
<nav class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 md:px-8 h-20 bg-white/5 backdrop-blur-[30px] border-b border-white/10 shadow-[0_8px_32px_0_rgba(0,0,0,0.36)] font-['Space_Grotesk']">
  <a href="index.html" class="text-2xl font-black tracking-tighter text-white uppercase">SHOP HERE</a>
  <div class="hidden md:flex items-center gap-8">
    <a class="text-[#0070FF] font-bold border-b-2 border-[#0070FF] pb-1" href="index.html">Marketplace</a>
    <a class="text-gray-400 font-medium hover:text-white transition-colors" href="support.html">Support</a>
    <a class="text-gray-400 font-medium hover:text-white transition-colors" href="support.html">Status</a>
  </div>
  <div class="flex items-center gap-6">
    <a href="checkout.html"><span class="material-symbols-outlined text-white cursor-pointer hover:text-[#0070FF] transition-all">shopping_cart</span></a>
  </div>
</nav>

<main class="pt-32 pb-xxl px-4 md:px-8 max-w-7xl mx-auto">

  <!-- Hero -->
  <section class="flex flex-col items-center text-center mb-xxl">
    <h1 class="font-['Space_Grotesk'] font-bold text-3xl md:text-4xl lg:text-5xl xl:text-6xl mb-md max-w-4xl tracking-tighter leading-tight">
      Apple Music Plans<span class="text-primary-container">.</span>
    </h1>
    <p class="text-base md:text-lg text-on-surface-variant mb-xl max-w-2xl leading-relaxed">
      Choose your Apple Music plan. High-quality audio, offline listening, and exclusive content.
    </p>
    <a href="index.html" class="text-[#0070FF] hover:underline">← Back to Marketplace</a>
  </section>

  <!-- Product Grid -->
  <section id="services-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg mb-xxl">
    </section>
</main>

<script>
  const services = [
    {
      name: "Apple Music Family",
      description: "Family plan for Apple Music.",
      price: "23,500 MMK",
      duration: "3 Months",
      icon: "music_note",
      iconColor: "text-pink-500"
    },
    {
      name: "Apple Music Individual",
      description: "Individual plan for Apple Music.",
      price: "40,000 MMK",
      duration: "3 Months",
      icon: "music_note",
      iconColor: "text-pink-500"
    },
    {
      name: "Apple Music Individual",
      description: "Individual plan for Apple Music.",
      price: "72,000 MMK",
      duration: "6 Months",
      icon: "music_note",
      iconColor: "text-pink-500"
    },
    {
      name: "Apple Music Individual",
      description: "Individual plan for Apple Music.",
      price: "12,000 MMK",
      duration: "12 Months",
      icon: "music_note",
      iconColor: "text-pink-500"
    }
  ];

  function renderServices() {
    const grid = document.getElementById('services-grid');
    grid.innerHTML = services.map(service => `
      <div class="glass-card rounded-[24px] p-4 md:p-6 flex flex-col justify-between h-full">
        <div>
          <div class="flex justify-between items-start mb-md">
            <span class="material-symbols-outlined text-4xl ${service.iconColor}">${service.icon}</span>
            <span class="bg-white/10 text-white/70 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">
              ${service.duration}
            </span>
          </div>
          <h3 class="font-h3 text-white mb-2">${service.name}</h3>
          <p class="text-outline text-sm mb-6">${service.description}</p>
        </div>
        
        <div class="mt-auto">
          <div class="flex items-baseline gap-1 mb-4">
            <span class="text-white font-bold text-2xl">${service.price}</span>
          </div>
          <button onclick="addToCart('${service.name}', '${service.price}', '${service.icon}', '${service.iconColor}')" class="w-full bg-[#0070FF] text-white font-bold py-3 rounded-xl glow-blue hover:bg-[#0056CC] transition-all flex items-center justify-center gap-2">
            Buy Now <span class="material-symbols-outlined text-sm">shopping_cart</span>
          </button>
        </div>
      </div>
    `).join('');
  }

  function addToCart(name, price, icon, iconColor) {
    // Show Apple Music credentials form instead of directly adding to cart
    showAppleMusicCredentialsForm(name, price, icon, iconColor);
  }

  function showAppleMusicCredentialsForm(name, price, icon, iconColor) {
    // Create modal overlay
    const modal = document.createElement('div');
    modal.id = 'apple-music-modal';
    modal.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4';
    modal.innerHTML = `
      <div class="glass-card rounded-xxl p-6 md:p-8 max-w-md w-full mx-auto">
        <div class="flex justify-between items-center mb-6">
          <h3 class="font-h2 text-h2 text-white">Apple Music Account Details</h3>
          <button onclick="closeAppleMusicModal()" class="text-outline hover:text-white transition-colors">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        
        <p class="text-outline text-sm mb-6 leading-relaxed">
          To send you an Apple Music Family invitation, we need your Apple ID email address. We'll send the invitation link to upgrade your account.
        </p>
        
        <form id="apple-music-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-white mb-2">Apple ID Email Address</label>
            <input 
              type="email" 
              id="apple-music-email" 
              required 
              class="w-full px-4 py-3 bg-surface-container rounded-xl border border-white/10 text-white placeholder-outline focus:border-[#0070FF] focus:outline-none transition-colors"
              placeholder="your@icloud.com or email"
            >
          </div>
          
          <div class="flex items-center gap-3 p-3 bg-blue-500/10 border border-blue-500/20 rounded-xl">
            <span class="material-symbols-outlined text-blue-500">info</span>
            <p class="text-xs text-blue-200">Make sure this is the email associated with your Apple ID. You'll receive an invitation email to join the Family plan.</p>
          </div>
          
          <div class="flex gap-3 pt-4">
            <button 
              type="button" 
              onclick="closeAppleMusicModal()" 
              class="flex-1 px-6 py-3 glass-card rounded-xl font-label-caps text-label-caps uppercase text-white hover:bg-white/10 transition-all"
            >
              Cancel
            </button>
            <button 
              type="submit" 
              class="flex-1 bg-[#0070FF] text-white py-3 rounded-xl font-bold hover:bg-[#0056CC] transition-all"
            >
              Continue to Payment
            </button>
          </div>
        </form>
      </div>
    `;
    
    document.body.appendChild(modal);
    
    // Handle form submission
    document.getElementById('apple-music-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('apple-music-email').value;
      
      if (email) {
        // Store Apple Music email in localStorage
        const appleMusicCredentials = {
          email: email,
          plan: name,
          price: price,
          timestamp: new Date().toISOString()
        };
        localStorage.setItem('apple_music_credentials', JSON.stringify(appleMusicCredentials));
        
        // Now add to cart and proceed to checkout
        proceedToCheckout(name, price, icon, iconColor);
      }
    });
  }

  function closeAppleMusicModal() {
    const modal = document.getElementById('apple-music-modal');
    if (modal) {
      modal.remove();
    }
  }

  function proceedToCheckout(name, price, icon, iconColor) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const existing = cart.find(item => item.name === name && item.price === price);
    if (existing) {
      existing.quantity = (existing.quantity || 1) + 1;
    } else {
      cart.push({ name, price, icon, iconColor, quantity: 1 });
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    window.location.href = 'checkout.html';
  }

  // Run the function when page loads
  renderServices();
</script>

</body>
</html>
